# Neurone runtime configuration (Milestone 1).
# Secrets are NOT read from this file. The Solami gRPC token comes from the
# environment (SOLAMI_GRPC_TOKEN). See .env.example.

[runtime]
# Number of independent market-state shards. Each shard owns its markets and
# runs as its own task; there is no global lock over market state.
shards = 8
# Bounded capacity of each shard channel (backpressure boundary).
shard_channel_capacity = 8192
# Tokio worker threads. Defaults to max(2, available_parallelism) when omitted.
# worker_threads = 4

[ingest]
# "solami" (live Yellowstone gRPC) or "simulated" (offline generator).
source = "solami"
# Solami Yellowstone gRPC endpoint (TLS, port 443).
endpoint = "https://grpc.solami.dev:443"
# processed | confirmed | finalized
commitment = "processed"
ping_interval_ms = 15000
connect_timeout_ms = 10000
reconnect_initial_ms = 500
reconnect_max_ms = 30000
stale_stream_timeout_ms = 30000
# Reconnect with from_slot = last_seen + 1 (Solami replays up to ~3,500 slots).
replay_from_last_slot = true

[ingest.filters]
# Slot interslot transitions for slot/block metadata + connection heartbeat.
slot_updates = true
block_meta = true
# Transactions touching these programs. `account_include` keeps the filter
# scoped (a filter with no account_include is rejected as a firehose on
# non-PAYG streams).
# pump.fun program id, from Solami's official gRPC SDK example.
transaction_programs = ["6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"]
# Accounts owned by these programs are tracked as market states.
account_programs = ["6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"]
# Additional explicit account pubkeys to track as markets.
account_addresses = []

[ingest.simulated]
markets = 512
events_per_second = 5000
# 0 = run until shutdown.
total_events = 0

[telemetry]
report_interval_ms = 5000
# Latency histogram bucket boundaries, nanoseconds.
latency_boundaries_ns = [
  100, 500, 1000, 5000, 10000, 25000, 50000, 100000,
  250000, 500000, 1000000, 5000000, 10000000, 50000000,
  100000000, 1000000000,
]
