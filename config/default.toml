# Neurone runtime configuration (Milestone 1).
# Secrets are NOT read from this file. The Solami gRPC token comes from the
# environment (SOLAMI_GRPC_TOKEN). See .env.example.

[runtime]
# Number of independent market-state shards. Each shard owns its markets and
# runs as its own task; there is no global lock over market state.
shards = 8
# Bounded capacity of each shard channel (backpressure boundary).
shard_channel_capacity = 8192
# Tokio worker threads. Defaults to max(2, available_parallelism) when omitted.
# worker_threads = 4

[ingest]
# "solami" (live Yellowstone gRPC) or "simulated" (offline generator).
source = "solami"
# Solami Yellowstone gRPC endpoint (TLS, port 443).
endpoint = "https://grpc.solami.dev:443"
# processed | confirmed | finalized
commitment = "processed"
ping_interval_ms = 15000
connect_timeout_ms = 10000
reconnect_initial_ms = 500
reconnect_max_ms = 30000
stale_stream_timeout_ms = 30000
# Reconnect with from_slot = last_seen + 1 (Solami replays up to ~3,500 slots).
replay_from_last_slot = true

[ingest.filters]
# Slot interslot transitions for slot/block metadata + connection heartbeat.
slot_updates = true
block_meta = true
# Transactions touching these programs. `account_include` keeps the filter
# scoped (a filter with no account_include is rejected as a firehose on
# non-PAYG streams). Program ids from the official pump.fun IDLs:
#   pump.fun bonding curve + pump.swap AMM.
transaction_programs = [
  "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",
  "pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA",
]
# Accounts owned by these programs are tracked as market states. The pump.fun
# program is subscribed so bonding-curve state is continuously maintained from
# an authoritative source, and so a market invalidated by a fee sweep can be
# re-established by a fresh account update. The memcmp discriminator below
# narrows the owner filter to the BondingCurve account type only (not a
# firehose). Use config/live_probe.toml for a slots-only probe.
account_programs = ["6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"]
# Optional base58 anchor discriminator (byte offset 0) applied to the account
# subscription. `4y6pru6YvC7` = pump.fun BondingCurve discriminator.
account_memcmp_base58 = "4y6pru6YvC7"
# Additional explicit account pubkeys to track as markets.
account_addresses = []
# Exact account addresses streamed as the SOL/USD reference (Pyth SOL/USD
# PriceUpdateV2). Decoded into the reference state, never into a market.
sol_usd_accounts = ["7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE"]
# Additional bounded account subscriptions (one account type each; never a
# token-account firehose). The PumpSwap AMM `Pool` accounts are subscribed so a
# pool discovered after launch is known — identity, mints, vault addresses and
# signed virtual_quote_reserves — and can bootstrap its raw vault balances from
# transaction postTokenBalances (no RPC, no swap required).
# `hQrXeCntzbV` = base58 of the pump_amm Pool discriminator (f19a6d0411b16dbc).
[[ingest.filters.extra_accounts]]
programs = ["pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"]
memcmp_base58 = "hQrXeCntzbV"

[ingest.simulated]
markets = 512
events_per_second = 5000
# 0 = run until shutdown.
total_events = 0

[telemetry]
report_interval_ms = 5000
# Latency histogram bucket boundaries, nanoseconds.
latency_boundaries_ns = [
  100, 500, 1000, 5000, 10000, 25000, 50000, 100000,
  250000, 500000, 1000000, 5000000, 10000000, 50000000,
  100000000, 1000000000,
]

[market]
# Reserves are considered stale once the current slot is more than this many
# slots past the last observed reserve update. Infrastructure setting only.
reserve_stale_slots = 150

[strategy]
# M4 Strategy V1 — qualification only (no arming, signing, execution, TP/SL).
# Thresholds are the locked V1 specification.
min_liquidity_usd = 2000
min_market_cap_usd = 2000
max_market_cap_usd = 10000
rolling_volume_window_seconds = 300
min_rolling_volume_usd = 1000
#
# OPERATOR INPUT — static SOL/USD price in micros (1e-6 USD). There is no live
# price oracle in scope (no RPC/HTTP), so USD gates are evaluated against this
# constant. It is deliberately unset here: the repository must not invent a
# price. M4 stays INACTIVE (nothing is evaluated or qualified) until you set it.
#
# sol_usd_price_micros = 200000000   # e.g. $200.00 per SOL
#
# SOL/USD reference source: "static" (the operator price above) or
# "pyth_yellowstone" (the on-chain Pyth SOL/USD PriceUpdateV2 account streamed
# over the existing Yellowstone transport — no HTTP, no RPC). In pyth mode M4
# always evaluates and fails closed while the reference is absent/stale.
sol_usd_source = "pyth_yellowstone"
# Maximum age of the local SOL/USD reference before it is stale (ms), measured
# on the monotonic receive clock. Derived from the Pyth sponsored feed's
# documented 55 s heartbeat: 120 s tolerates one missed heartbeat.
sol_usd_max_staleness_ms = 120000
#
# Probe notional for executable buy/sell route checks, raw quote units
# (lamports). Defaults to 0.1 SOL if omitted.
# probe_notional_lamports = 100000000
#
# Maximum token age (locked: 15 minutes). This is a MAXIMUM — a token must be at
# most 900 s old to qualify; it does not require the token to have existed for
# 15 minutes. Boundary is slot-exact (<= 2250 slots passes). If creation cannot
# be proven, the market fails closed while this gate is enabled.
max_token_age_seconds = 900
#
# Optional gates. Left unset on purpose — no numeric value is specified by the
# project, so none is invented. Unset disables the gate.
# max_drawdown_bps = ...           # anti-pump retracement (qualification, not stop-loss)
# max_roundtrip_loss_bps = ...     # round-trip execution-economics bound
# max_price_impact_bps = ...       # buy price-impact bound
