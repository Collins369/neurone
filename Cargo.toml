[package]
name = "neurone"
version = "0.1.0"
edition = "2021"
description = "Neurone — parallel, event-driven Solana market-state runtime (Milestone 1)"
publish = false

[lib]
name = "neurone"
path = "src/lib.rs"

[[bin]]
name = "neurone"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bs58 = "0.5"
dotenvy = "0.15"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
yellowstone-grpc-client = "14"
yellowstone-grpc-proto = "13"

[dev-dependencies]
# `test-tools` exposes in-memory mock streams so ingestion can be tested
# without a live Solami credential.
yellowstone-grpc-client = { version = "14", features = ["test-tools"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
